[project]
name = "ingestion-agent"
version = "0.1.0"
description = "Sofii multi-modal document ingestion service (Python + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-redis>=0.0.5",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pandas>=2.2",
    "tabulate>=0.9",
    "python-multipart>=0.0.12",
    "supabase>=2.10",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
